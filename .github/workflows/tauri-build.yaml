name: "publish"

on:
  push:
    branches:
      - 'release/*'

# This is the example from the readme.
# On each push to the `release` branch it will create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          # - platform: "ubuntu-22.04" # for Tauri v1 you could replace this with ubuntu-20.04.
          #   args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # - name: install dependencies (ubuntu only)
        # if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        # run: |
        #   sudo apt-get update
        #   sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.

      - name: install frontend dependencies
        run: yarn install # change this to npm, pnpm or bun depending on which one you use.

      # 使用 rust-cache Action 可以缓存 Cargo 的注册表和构建工件，大幅减少后续构建的时间
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      
      - name: Setup Apple Code Signing
        env:
          CERTIFICATE_DATA: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          # ========== 第一部分：设置统一的钥匙串密码 ==========
          KEYCHAIN_PASSWORD="ci-build-$(date +%s)"  # 生成唯一密码
          KEYCHAIN_NAME="build.keychain"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"
          
          # ========== 第二部分：创建并设置钥匙串 ==========
          # 1. 删除可能已存在的旧钥匙串（避免冲突）
          security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
          
          # 2. 创建新钥匙串（使用统一密码）
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # 3. 设置为默认钥匙串并解锁
          security default-keychain -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          
          # ========== 第三部分：导入证书 ==========
          echo $CERTIFICATE_DATA | base64 --decode > certificate.p12
          
          # 导入证书到钥匙串（使用统一的钥匙串密码）
          security import certificate.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          
          # 清理临时文件
          rm -f certificate.p12
          
          # ========== 第四部分：配置钥匙串属性 ==========
          # 设置钥匙串超时（避免自动锁定）
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_NAME"
          
          # 设置分区列表（关键：使用统一的钥匙串密码）
          security set-key-partition-list \
            -S "apple-tool:,apple:,codesign:,productsign:" \
            -s \
            -k "$KEYCHAIN_PASSWORD" \  # 这里使用 KEYCHAIN_PASSWORD，不是 "ci-build"
            "$KEYCHAIN_NAME"
          
          # ========== 第五部分：创建 .p8 私钥文件 ==========
          echo $API_PRIVATE_KEY | base64 --decode > "$RUNNER_TEMP/authkey.p8"
          echo "✅ 私钥文件已创建于: $RUNNER_TEMP/authkey.p8"
          
          # ========== 第六部分：验证设置 ==========
          echo "🔐 当前默认钥匙串:"
          security default-keychain
          
          echo "📋 可用签名证书:"
          security find-identity -p codesigning "$KEYCHAIN_NAME" | grep -v "valid identities found"
          
          # 显示证书详情（调试用）
          CERT_IDENTITY=$(security find-identity -p codesigning -v "$KEYCHAIN_NAME" | head -1 | cut -d'"' -f2)
          if [ ! -z "$CERT_IDENTITY" ]; then
              echo "🎯 将使用证书: $CERT_IDENTITY"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }} 
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # 关键：指向刚才动态创建的 .p8 文件路径
          APPLE_API_KEY_PATH: "${{ runner.temp }}/authkey.p8"
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          #将 releaseDraft 设置为 true，这样会自动创建 Release 草稿而不是直接发布，给你一个检查确认的机会
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
